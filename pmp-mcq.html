                        <!-- Hint Section -->
                        ${!state.isAnswerSubmitted ? `
                            <div class="mt-6">
                                <button onclick="toggleHint()" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                                    <i class="fa-regular fa-lightbulb"></i> ${state.showHint ? 'Hide Hint' : 'Show Hint'}
                                </button>
                                ${state.showHint ? `
                                    <div class="mt-2 p-3 bg-blue-50 border border-blue-100 rounded-lg text-sm text-blue-800 fade-in italic">
                                        ${q.hint}
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>

                    <!-- Footer Actions -->
                    <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                        ${!state.isAnswerSubmitted ? `
                            <button 
                                onclick="submitAnswer()" 
                                class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold py-2.5 px-6 rounded-lg transition duration-200"
                                ${state.selectedOptionIndex === null ? 'disabled' : ''}
                            >
                                Submit Answer
                            </button>
                        ` : `
                            <button 
                                onclick="nextQuestion()" 
                                class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 px-6 rounded-lg transition duration-200 flex items-center gap-2"
                            >
                                ${state.currentQuestionIndex < totalQ - 1 ? 'Next Question <i class="fa-solid fa-arrow-right"></i>' : 'View Results <i class="fa-solid fa-flag-checkered"></i>'}
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderResultsScreen() {
            const total = quizData.questions.length;
            const percentage = Math.round((state.score / total) * 100);
            
            let message = "";
            let icon = "";
            let colorClass = "";

            if (percentage >= 80) {
                message = "Outstanding! You are well-prepared for the exam.";
                icon = "fa-trophy";
                colorClass = "text-yellow-500";
            } else if (percentage >= 60) {
                message = "Good job! A little more revision and you'll be perfect.";
                icon = "fa-thumbs-up";
                colorClass = "text-blue-500";
            } else {
                message = "Keep studying! Focus on the explanations to improve.";
                icon = "fa-book-open";
                colorClass = "text-indigo-500";
            }

            return `
                <div class="p-10 flex flex-col items-center justify-center text-center h-full flex-grow fade-in">
                    <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mb-6 shadow-inner border border-slate-100">
                        <i class="fa-solid ${icon} text-5xl ${colorClass}"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                    <div class="text-5xl font-extrabold text-slate-800 my-4">
                        ${state.score} <span class="text-2xl text-slate-400 font-medium">/ ${total}</span>
                    </div>
                    <p class="text-lg font-medium text-slate-600 mb-2">${percentage}% Score</p>
                    <p class="text-slate-500 mb-8 max-w-sm">${message}</p>
                    
                    <button onclick="restartQuiz()" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-8 rounded-lg shadow-md transition duration-200 flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Retake Quiz
                    </button>
                </div>
            `;
        }

        // Actions
        function startQuiz() {
            state.screen = 'quiz';
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.selectedOptionIndex = null;
            state.isAnswerSubmitted = false;
            state.showHint = false;
            state.answers = [];
            render();
        }

        function selectOption(index) {
            state.selectedOptionIndex = index;
            render();
        }

        function toggleHint() {
            state.showHint = !state.showHint;
            render();
        }

        function submitAnswer() {
            if (state.selectedOptionIndex === null) return;
            
            const q = quizData.questions[state.currentQuestionIndex];
            const isCorrect = q.answerOptions[state.selectedOptionIndex].isCorrect;
            
            if (isCorrect) {
                state.score++;
            }
            
            state.answers.push({
                questionIndex: state.currentQuestionIndex,
                selectedOption: state.selectedOptionIndex,
                isCorrect: isCorrect
            });

            state.isAnswerSubmitted = true;
            render();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < quizData.questions.length - 1) {
                state.currentQuestionIndex++;
                state.selectedOptionIndex = null;
                state.isAnswerSubmitted = false;
                state.showHint = false;
                render();
            } else {
                state.screen = 'results';
                render();
            }
        }

        function restartQuiz() {
            startQuiz();
        }

        // Initialize app
        render();

    </script>
</body>
</html>
